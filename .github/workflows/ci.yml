name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore OarTools.sln
      - name: Build
        run: dotnet build OarTools.sln -c Release --no-restore
      - name: Test
        run: dotnet test OarTools.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
